<body data-page="inquire">
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="site-header"></div>
<div id="page-inquire" class="page active" role="main">
  <div class="inquire-hero">
    <div class="hero-inner">
      <div class="section-label"><span class="gold-line"></span><span data-en="Coaching Inquiry" data-ko="코칭 문의">코칭 문의</span></div>
      <h1 class="display-xl">
        <span data-en="LET'S" data-ko="함께">함께</span><br>
        <span class="text-gold" data-en="CONNECT" data-ko="시작해요">시작해요</span>
      </h1>
    </div>
  </div>

  <section>
    <div class="section-inner">
      <div class="contact-grid">
        <div class="reveal-left">
          <div class="section-label"><span class="gold-line"></span><span data-en="Details" data-ko="세부 정보">세부 정보</span></div>
          <div class="contact-info-item">
            <div class="contact-info-label" data-en="Based In" data-ko="위치">위치</div>
            <div class="contact-info-value" data-en="Seoul, South Korea" data-ko="대한민국 서울">대한민국 서울</div>
          </div>
          <div class="contact-info-item">
            <div class="contact-info-label" data-en="Fastest Reply" data-ko="가장 빠른 답장">가장 빠른 답장</div>
            <div class="contact-info-value" data-en="KakaoTalk" data-ko="카카오톡">카카오톡</div>
          </div>
          <div class="contact-info-item">
            <div class="contact-info-label" data-en="Languages" data-ko="언어">언어</div>
            <div class="contact-info-value" data-en="English · Korean" data-ko="영어 · 한국어">영어 · 한국어</div>
          </div>
          <div class="contact-info-item">
            <div class="contact-info-label" data-en="Training Locations" data-ko="훈련 장소">훈련 장소</div>
            <div class="contact-info-value">
              <span data-en="Seoul — in-person or virtual" data-ko="서울 — 대면 또는 비대면">서울 — 대면 또는 비대면</span>
              <span class="location-line" data-en="USA — virtual, including Austin, Texas" data-ko="미국 — 텍사스주 오스틴을 포함한 비대면 코칭">미국 — 텍사스주 오스틴을 포함한 비대면 코칭</span>
            </div>
          </div>
          <div class="contact-note">
            <p class="text-small" data-en="For the fastest reply, include your goal, timeline, training location, and which coaching tier you are considering." data-ko="빠른 답변을 원하시면 목표, 일정, 훈련 장소, 고려 중인 코칭 등급을 함께 적어 주세요.">빠른 답변을 원하시면 목표, 일정, 훈련 장소, 고려 중인 코칭 등급을 함께 적어 주세요.</p>
          </div>
        </div>

        <div class="reveal-right">
          <div class="section-label"><span class="gold-line"></span><span data-en="Inquiry Form" data-ko="문의 양식">문의 양식</span></div>
          <form class="form-grid" id="contactForm" action="/api/form-submit" method="post">
            <input type="hidden" name="formType" value="contact">
            <input class="form-honeypot" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
            <div class="form-field">
              <label class="form-label" for="contactName" data-en="Full Name" data-ko="성함">성함</label>
              <input class="form-input" id="contactName" name="name" type="text" autocomplete="name" required data-placeholder-en="Your name" data-placeholder-ko="성함">
            </div>
            <div class="form-field">
              <label class="form-label" for="contactEmail" data-en="Email" data-ko="이메일">이메일</label>
              <input class="form-input" id="contactEmail" name="email" type="email" autocomplete="email" required data-placeholder-en="your@email.com" data-placeholder-ko="your@email.com">
            </div>
            <div class="form-field full">
              <label class="form-label" for="contactMethod" data-en="Phone / KakaoTalk" data-ko="전화 / 카카오톡">전화 / 카카오톡</label>
              <input class="form-input" id="contactMethod" name="contact" type="text" autocomplete="tel" data-placeholder-en="+82 or KakaoTalk ID" data-placeholder-ko="전화번호 또는 카카오톡 ID">
            </div>
            <div class="form-field full"><label class="form-label" for="contactPackage" data-en="Interested Package" data-ko="관심 있는 패키지">관심 있는 패키지</label>
<select class="form-select2" id="contactPackage" name="package"><option value="unsure" data-en="Help me choose" data-ko="상담 후 결정할게요">상담 후 결정할게요</option><option value="coaching-virtual" data-en="Virtual Coaching" data-ko="비대면 코칭">비대면 코칭</option><option value="coaching-body-profile" data-en="Body Profile" data-ko="바디프로필">바디프로필</option><option value="coaching-hybrid" data-en="Hybrid Coaching" data-ko="하이브리드 코칭">하이브리드 코칭</option><option value="coaching-s-tier" data-en="S-Tier" data-ko="S-Tier">S-Tier</option><option value="coaching-in-person-single" data-en="1:1 Training Session" data-ko="1:1 대면 트레이닝 1회">1:1 대면 트레이닝 1회</option><option value="coaching-in-person-10" data-en="10 In-Person Sessions" data-ko="1:1 대면 트레이닝 10회">1:1 대면 트레이닝 10회</option></select></div>
<div class="form-field full"><label class="form-label" for="contactStart" data-en="When would you like to start?" data-ko="언제 시작하고 싶으신가요?">언제 시작하고 싶으신가요?</label><select class="form-select2" id="contactStart" name="startTiming"><option value="exploring" data-en="I’m exploring my options" data-ko="아직 알아보는 중이에요">아직 알아보는 중이에요</option><option value="soon" data-en="As soon as possible" data-ko="가능한 한 빨리">가능한 한 빨리</option><option value="within-four-weeks" data-en="Within 4 weeks" data-ko="4주 이내">4주 이내</option><option value="later" data-en="Later / a specific date" data-ko="나중에 또는 정해진 날짜에">나중에 또는 정해진 날짜에</option></select></div>
            <div class="form-field full">
              <label class="form-label" for="contactMessage" data-en="Message" data-ko="메시지">메시지</label>
              <textarea class="form-textarea" id="contactMessage" name="message" required data-placeholder-en="Share your goal, timeline, training location, and which tier you are considering..." data-placeholder-ko="목표, 일정, 훈련 장소, 고려 중인 코칭 등급을 알려 주세요..."></textarea>
            </div>
            <div class="form-field full">
              <button class="btn btn-gold btn-full" type="submit">
                <span data-en="Send Message" data-ko="메시지 전송">메시지 전송</span>
                <span class="btn-arrow">→</span>
              </button>
              <p class="form-status" id="contactFormStatus" role="status" aria-live="polite"></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
  
</div>
<div id="site-footer"></div>
