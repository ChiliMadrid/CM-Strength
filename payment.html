<body data-page="payment">
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="site-header"></div>
<div id="page-payment" class="page active" role="main">
  <section class="payment-page">
    <div class="payment-shell">
      <div class="payment-visual">
        <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1200&q=80" alt="온라인 결제를 위한 책상 사진" data-alt-en="Secure online payment desk setup" data-alt-ko="온라인 결제를 위한 책상 사진">
        <div class="payment-visual-copy">
          <span class="payment-kicker">CM Strength</span>
          <h1 data-en="Secure Checkout" data-ko="안전한 결제">안전한 결제</h1>
          <p data-en="Payment details are collected on Stripe-hosted Checkout, not on this website." data-ko="결제 정보는 이 웹사이트가 아닌 Stripe 호스팅 결제 페이지에서 입력됩니다.">결제 정보는 이 웹사이트가 아닌 Stripe 호스팅 결제 페이지에서 입력됩니다.</p>
        </div>
      </div>

      <div class="payment-panel">
        <div class="payment-badge" data-en="Stripe Checkout" data-ko="Stripe 결제">Stripe 결제</div>
        <h2 data-en="Complete Payment" data-ko="결제 완료하기">결제 완료하기</h2>
        <p class="payment-subtext" data-en="Review your cart, then continue to Stripe's hosted payment page. Card details are handled by Stripe." data-ko="장바구니를 확인한 뒤 Stripe 호스팅 결제 페이지로 이동하세요. 카드 정보는 Stripe에서 처리됩니다.">장바구니를 확인한 뒤 Stripe 호스팅 결제 페이지로 이동하세요. 카드 정보는 Stripe에서 처리됩니다.</p>

        <div class="payment-summary">
          <div>
            <span data-en="Selected service" data-ko="선택한 서비스">선택한 서비스</span>
            <strong id="paymentServiceLabel">비대면 코칭</strong>
          </div>
          <div>
            <span data-en="Due today" data-ko="오늘 결제 금액">오늘 결제 금액</span>
            <strong id="paymentAmountLabel">₩200,000</strong>
          </div>
        </div>
        <div class="payment-cart-summary" id="paymentCartSummary"></div><p class="payment-subtext" data-en="Coaching plans cover four-week blocks; individual sessions and the 10-session package are sold by session count. Complete the detailed intake after payment, before training starts. If you need help choosing, contact your coach first." data-ko="코칭 플랜은 4주 단위이며, 1회권과 10회권은 세션 횟수 기준입니다. 자세한 사전 설문은 결제 후 훈련 시작 전에 작성합니다. 패키지 선택이 어렵다면 먼저 코치에게 문의해 주세요.">코칭 플랜은 4주 단위이며, 1회권과 10회권은 세션 횟수 기준입니다. 자세한 사전 설문은 결제 후 훈련 시작 전에 작성합니다. 패키지 선택이 어렵다면 먼저 코치에게 문의해 주세요.</p><a href="contact.html" class="blog-back-link" data-en="Ask Before Buying" data-ko="구매 전 문의하기">구매 전 문의하기</a>

        <form class="payment-form" id="stripeCheckoutForm">
          <div class="form-field full">
            <label class="form-label" for="payEmail" data-en="Email" data-ko="이메일">이메일</label>
            <input class="form-input" id="payEmail" name="email" type="email" autocomplete="email" required data-placeholder-en="client@email.com" data-placeholder-ko="client@email.com">
          </div>
          <div class="form-field full">
            <label class="form-label" for="paymentPackage" data-en="Package" data-ko="패키지">패키지</label>
            <select class="form-select2" id="paymentPackage" name="package" required>
              <option value="coaching-virtual" data-en="Virtual Coaching - ₩200,000" data-ko="비대면 코칭 - ₩200,000">비대면 코칭 - ₩200,000</option>
              <option value="coaching-body-profile" data-en="Body Profile - ₩400,000" data-ko="바디프로필 - ₩400,000">바디프로필 - ₩400,000</option>
              <option value="coaching-hybrid" data-en="Hybrid Coaching - ₩600,000" data-ko="하이브리드 코칭 - ₩600,000">하이브리드 코칭 - ₩600,000</option>
              <option value="coaching-s-tier" data-en="S-Tier - ₩800,000" data-ko="S-Tier 코칭 - ₩800,000">S-Tier 코칭 - ₩800,000</option>
              <option value="coaching-in-person-single" data-en="1:1 In-Person Session - ₩60,000" data-ko="1:1 대면 트레이닝 1회 - ₩60,000">1:1 대면 트레이닝 1회 - ₩60,000</option>
              <option value="coaching-in-person-10" data-en="10 In-Person Sessions - ₩500,000" data-ko="1:1 대면 트레이닝 10회 - ₩500,000">1:1 대면 트레이닝 10회 - ₩500,000</option>
            </select>
          </div>
          <button class="btn btn-gold btn-full" type="submit">
            <span data-en="Continue to Stripe" data-ko="Stripe로 계속하기">Stripe로 계속하기</span>
            <span class="btn-arrow">→</span>
          </button>
          <p class="payment-status" id="paymentStatus" role="status"></p>
        </form>
      </div>
    </div>
  </section>
</div>
<div id="site-footer"></div>
