<body data-page="intake">
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div id="site-header"></div>
<div id="page-intake" class="page active" role="main">
  <div class="inquire-hero">
    <div class="hero-inner">
      <div class="section-label"><span class="gold-line"></span><span data-en="Client Intake" data-ko="코칭 사전 설문">코칭 사전 설문</span></div>
      <h1 class="display-xl">
        <span data-en="INTAKE" data-ko="사전">사전</span><br>
        <span class="text-gold" data-en="ASSESSMENT" data-ko="평가">평가</span>
      </h1>
    </div>
  </div>

  <section>
    <div class="section-inner">
      <p class="intro-copy" data-en="Complete this intake after arranging coaching with your coach or completing payment, and before your first training session. Your answers are emailed to your coach to help plan your training. Write “None” where a question does not apply." data-ko="코치와 코칭 진행을 확정하거나 결제를 완료한 뒤, 첫 훈련 전에 작성해 주세요. 답변은 훈련 계획 수립을 위해 코치에게 이메일로 전달됩니다. 해당 사항이 없는 항목에는 “없음”이라고 적어 주세요.">코치와 코칭 진행을 확정하거나 결제를 완료한 뒤, 첫 훈련 전에 작성해 주세요. 답변은 훈련 계획 수립을 위해 코치에게 이메일로 전달됩니다. 해당 사항이 없는 항목에는 “없음”이라고 적어 주세요.</p>

      <form class="form-grid intake-form" id="intakeForm" action="/api/form-submit" method="post">
        <input type="hidden" name="formType" value="intake">
        <input class="form-honeypot" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="intake-section form-field full">
          <h2 data-en="Health & Safety" data-ko="건강 및 안전">건강 및 안전</h2>
        </div>
        <div class="form-field full">
          <label class="form-label" for="medicalHistory" data-en="Medical History" data-ko="병력">병력</label>
          <textarea class="form-textarea" id="medicalHistory" name="Medical History" required data-placeholder-en="Any pre-existing or chronic medical conditions?" data-placeholder-ko="기존 질환이나 만성 질환이 있나요?"></textarea>
        </div>
        <div class="form-field full">
          <label class="form-label" for="medications" data-en="Medications" data-ko="복용 약 및 보충제">복용 약 및 보충제</label>
          <textarea class="form-textarea" id="medications" name="Medications" required data-placeholder-en="List all current medications and supplements, dosage, and reason." data-placeholder-ko="현재 복용 중인 약과 보충제, 용량, 복용 이유를 적어 주세요."></textarea>
        </div>
        <div class="form-field full">
          <label class="form-label" for="injuries" data-en="Injuries" data-ko="부상">부상</label>
          <textarea class="form-textarea" id="injuries" name="Injuries" required data-placeholder-en="Describe injuries or chronic pain points, when they occurred, and current status." data-placeholder-ko="부상이나 만성 통증 부위, 발생 시기, 현재 상태를 설명해 주세요."></textarea>
        </div>
        <div class="form-field full">
          <label class="form-label" for="allergies" data-en="Allergies" data-ko="알레르기">알레르기</label>
          <textarea class="form-textarea" id="allergies" name="Allergies" required data-placeholder-en="Medication, food, or environmental allergies." data-placeholder-ko="약물, 음식, 환경 알레르기를 적어 주세요."></textarea>
        </div>

        <div class="intake-section form-field full">
          <h2 data-en="Lifestyle & Habit Assessment" data-ko="생활 습관 평가">생활 습관 평가</h2>
        </div>
        <div class="form-field full">
          <label class="form-label" for="sleep" data-en="Sleep" data-ko="수면">수면</label>
          <textarea class="form-textarea" id="sleep" name="Sleep" required data-placeholder-en="Average hours per night and rested rating from 1-10." data-placeholder-ko="하루 평균 수면 시간과 회복감 점수(1-10)를 적어 주세요."></textarea>
        </div>
        <div class="form-field full">
          <label class="form-label" for="nutrition" data-en="Nutrition" data-ko="영양">영양</label>
          <textarea class="form-textarea" id="nutrition" name="Nutrition" required data-placeholder-en="Typical day of eating, meal timing, food groups, calories, restrictions." data-placeholder-ko="평소 식사, 식사 시간, 식품군, 칼로리, 제한 사항을 적어 주세요."></textarea>
        </div>
        <div class="form-field">
          <label class="form-label" for="stressLevel" data-en="Stress Level" data-ko="스트레스 수준">스트레스 수준</label>
          <input class="form-input" id="stressLevel" name="Stress Level" type="text" required data-placeholder-en="1-10" data-placeholder-ko="1-10">
        </div>
        <div class="form-field">
          <label class="form-label" for="activityOutsideTraining" data-en="Activity Outside Training" data-ko="운동 외 활동량">운동 외 활동량</label>
          <input class="form-input" id="activityOutsideTraining" name="Activity Outside Training" type="text" required data-placeholder-en="Walking, sports, job activity, etc." data-placeholder-ko="걷기, 스포츠, 직업 활동량 등을 적어 주세요.">
        </div>
        <div class="form-field full">
          <label class="form-label" for="stressors" data-en="Primary Stressors" data-ko="주요 스트레스 요인">주요 스트레스 요인</label>
          <textarea class="form-textarea" id="stressors" name="Primary Stressors" required data-placeholder-en="Main non-fitness stressors right now." data-placeholder-ko="현재 운동 외 가장 큰 스트레스 요인을 적어 주세요."></textarea>
        </div>

        <div class="intake-section form-field full">
          <h2 data-en="Logistics & Commitment" data-ko="연락처 및 참여 계획">연락처 및 참여 계획</h2>
        </div>
        <div class="form-field">
          <label class="form-label" for="legalName" data-en="Legal Name" data-ko="실명">실명</label>
          <input class="form-input" id="legalName" name="Legal Name" type="text" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="preferredName" data-en="Preferred Name" data-ko="불리고 싶은 이름">불리고 싶은 이름</label>
          <input class="form-input" id="preferredName" name="Preferred Name" type="text">
        </div>
        <div class="form-field">
          <label class="form-label" for="primaryEmail" data-en="Primary Email" data-ko="주 이메일">주 이메일</label>
          <input class="form-input" id="primaryEmail" name="Primary Email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="phoneNumber" data-en="Phone Number" data-ko="전화번호">전화번호</label>
          <input class="form-input" id="phoneNumber" name="Phone Number" type="tel" autocomplete="tel" required>
        </div>
        <div class="form-field full">
          <label class="form-label" for="commitment" data-en="Commitment" data-ko="실행 가능 시간">실행 가능 시간</label>
          <textarea class="form-textarea" id="commitment" name="Commitment" required data-placeholder-en="How many days per week can you commit to training and behavioral adjustments?" data-placeholder-ko="훈련과 생활 습관 조정에 주 몇 일을 투자할 수 있나요?"></textarea>
        </div>
        <div class="form-field full">
          <label class="form-label" for="accountability" data-en="Accountability" data-ko="책임감">책임감</label>
          <select class="form-select2" id="accountability" name="Accountability" required>
            <option value="" data-en="Select one" data-ko="선택해 주세요">선택해 주세요</option>
            <option value="Yes" data-en="Yes, I am willing to track and report daily." data-ko="네, 매일 기록하고 보고할 의향이 있습니다.">네, 매일 기록하고 보고할 의향이 있습니다.</option>
            <option value="No" data-en="No, I am not willing to track and report daily." data-ko="아니요, 매일 기록하고 보고하기는 어렵습니다.">아니요, 매일 기록하고 보고하기는 어렵습니다.</option>
          </select>
        </div>

        <div class="intake-section form-field full">
          <h2 data-en="Goals & Expectations" data-ko="목표 및 기대">목표 및 기대</h2>
        </div>
        <div class="form-field full">
          <label class="form-label" for="primaryGoal" data-en="Primary Goal" data-ko="주요 목표">주요 목표</label>
          <textarea class="form-textarea" id="primaryGoal" name="Primary Goal" required data-placeholder-en="Your single biggest measurable goal for the next 6-12 months." data-placeholder-ko="앞으로 6-12개월 동안 가장 중요한 측정 가능한 목표를 적어 주세요."></textarea>
        </div>
        <div class="form-field full">
          <label class="form-label" for="motivation" data-en="Motivation" data-ko="동기">동기</label>
          <textarea class="form-textarea" id="motivation" name="Motivation" required data-placeholder-en="What motivated you to start training today?" data-placeholder-ko="지금 훈련을 시작하려는 동기는 무엇인가요?"></textarea>
        </div>
        <div class="form-field full">
          <label class="form-label" for="expectations" data-en="Expectations & Fears" data-ko="기대와 걱정">기대와 걱정</label>
          <textarea class="form-textarea" id="expectations" name="Expectations and Fears" required data-placeholder-en="What do you expect to gain, and what are your biggest fears about starting?" data-placeholder-ko="얻고 싶은 것과 시작하기 전에 가장 걱정되는 점을 적어 주세요."></textarea>
        </div>
        <div class="form-field full">
          <button class="btn btn-gold btn-full" type="submit">
            <span data-en="Send Intake Form" data-ko="사전 설문 제출">사전 설문 제출</span>
            <span class="btn-arrow">→</span>
          </button>
          <p class="form-status" id="intakeFormStatus" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </section>
</div>
<div id="site-footer"></div>
</body>
</html>
